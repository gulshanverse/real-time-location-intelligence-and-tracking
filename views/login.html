<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GeoTrack | Secure Access</title>

    <meta name="description"
        content="Secure access to the GeoTrack real-time location intelligence dashboard.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #060a10;
            --surface: #0d131d;
            --surface-light: #111a26;

            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(56, 189, 248, 0.35);

            --text: #f5f7fa;
            --muted: #8b98aa;

            --cyan: #38bdf8;
            --cyan-soft: rgba(56, 189, 248, 0.10);

            --green: #22c55e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family: "Inter", sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(56, 189, 248, 0.10),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(37, 99, 235, 0.08),
                    transparent 32%
                ),
                var(--bg);

            overflow: hidden;
        }

        /* =========================
           BACKGROUND GRID
        ========================== */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;

            mask-image: linear-gradient(
                to bottom,
                black,
                transparent 85%
            );

            pointer-events: none;
        }

        /* =========================
           LOGIN CONTAINER
        ========================== */

        .login-wrapper {
            width: min(430px, 100%);

            position: relative;

            z-index: 1;
        }

        .login-card {
            background:
                linear-gradient(
                    145deg,
                    rgba(17, 26, 38, 0.96),
                    rgba(8, 13, 21, 0.98)
                );

            border: 1px solid var(--border);

            border-radius: 24px;

            padding: 42px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.025);

            backdrop-filter: blur(20px);
        }

        /* =========================
           BRAND
        ========================== */

        .brand {
            text-align: center;

            margin-bottom: 34px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;

            margin: 0 auto 18px;

            display: grid;
            place-items: center;

            border-radius: 18px;

            font-size: 28px;

            background: var(--cyan-soft);

            border: 1px solid rgba(56, 189, 248, 0.20);

            box-shadow:
                0 0 35px rgba(56, 189, 248, 0.08);
        }

        .brand h1 {
            font-size: 25px;

            font-weight: 800;

            letter-spacing: -0.8px;
        }

        .brand h1 span {
            color: var(--cyan);
        }

        .brand p {
            color: var(--muted);

            font-size: 12px;

            margin-top: 7px;
        }

        /* =========================
           WELCOME
        ========================== */

        .welcome {
            margin-bottom: 25px;
        }

        .welcome-label {
            color: var(--cyan);

            font-family: "JetBrains Mono", monospace;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            margin-bottom: 7px;
        }

        .welcome h2 {
            font-size: 21px;

            font-weight: 700;

            letter-spacing: -0.4px;
        }

        .welcome p {
            color: var(--muted);

            font-size: 13px;

            line-height: 1.6;

            margin-top: 7px;
        }

        /* =========================
           INPUTS
        ========================== */

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;

            color: #c6cfdb;

            font-size: 12px;

            font-weight: 600;

            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: var(--muted);

            font-size: 15px;

            pointer-events: none;
        }

        .input {
            width: 100%;

            height: 50px;

            padding: 0 15px 0 44px;

            color: var(--text);

            background: #080d15;

            border: 1px solid var(--border);

            border-radius: 12px;

            outline: none;

            font-family: "Inter", sans-serif;

            font-size: 13px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .input::placeholder {
            color: #536174;
        }

        .input:focus {
            border-color: var(--cyan);

            background: #0a111b;

            box-shadow:
                0 0 0 3px rgba(56, 189, 248, 0.08);
        }

        /* =========================
           LOGIN BUTTON
        ========================== */

        .login-button {
            width: 100%;

            height: 50px;

            margin-top: 7px;

            border: none;

            border-radius: 12px;

            color: #041019;

            background: var(--cyan);

            font-family: "Inter", sans-serif;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .login-button:hover {
            background: #67d3fa;

            transform: translateY(-1px);

            box-shadow:
                0 10px 30px rgba(56, 189, 248, 0.18);
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* =========================
           SECURITY STATUS
        ========================== */

        .security-status {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            margin-top: 22px;

            color: #7ee6a0;

            font-size: 10px;

            font-family: "JetBrains Mono", monospace;

            letter-spacing: 0.4px;
        }

        .security-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 10px rgba(34, 197, 94, 0.65);
        }

        /* =========================
           FOOTER
        ========================== */

        .footer {
            text-align: center;

            margin-top: 25px;

            color: #536174;

            font-size: 10px;

            line-height: 1.6;
        }

        .footer strong {
            color: #718096;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 480px) {

            body {
                padding: 16px;
            }

            .login-card {
                padding: 32px 24px;

                border-radius: 20px;
            }

            .brand {
                margin-bottom: 28px;
            }

            .brand-icon {
                width: 58px;
                height: 58px;
            }
        }
    </style>
</head>

<body>

    <main class="login-wrapper">

        <section class="login-card">

            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">
                    🌐
                </div>

                <h1>
                    Geo<span>Track</span>
                </h1>

                <p>
                    Real-Time Location Intelligence
                </p>

            </div>


            <!-- WELCOME -->

            <div class="welcome">

                <div class="welcome-label">
                    ● Secure Monitoring Console
                </div>

                <h2>
                    Welcome back.
                </h2>

                <p>
                    Sign in to access your real-time location
                    monitoring dashboard.
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form action="/login" method="post">

                <!-- USERNAME -->

                <div class="field">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ◉
                        </span>

                        <input
                            id="username"
                            type="text"
                            class="input"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                            name="username"
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ◆
                        </span>

                        <input
                            id="password"
                            type="password"
                            class="input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                            name="password"
                        >

                    </div>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In to GeoTrack →
                </button>

            </form>


            <!-- SECURITY -->

            <div class="security-status">

                <span class="security-dot"></span>

                AUTHENTICATED ACCESS REQUIRED

            </div>

        </section>


        <!-- FOOTER -->

        <div class="footer">

            <strong>GeoTrack</strong>
            · Real-Time Location Intelligence

            <br>

            Authorized educational & development use only.

        </div>

    </main>

</body>

</html>
